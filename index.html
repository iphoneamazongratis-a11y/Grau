<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BR Auto Open World</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginScreen">
    <div class="loginBox">
      <h1>BR Auto</h1>
      <p>Mundo aberto brasileiro privado</p>
      <input id="passwordInput" type="password" placeholder="Senha" />
      <button id="enterBtn">Entrar</button>
      <small>Senha padrão: <b>1234</b></small>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="dash">
      <div><span id="speed">0</span><small>km/h</small></div>
      <div><span id="rpm">900</span><small>RPM</small></div>
      <div><span id="gear">N</span><small>marcha</small></div>
      <div><span id="mode">CARRO</span><small>veículo</small></div>
    </div>
  </div>

  <div id="mapName">Mapa: Cidade BR / Favela / Posto / Praça</div>

  <div id="controls">
    <div class="leftPad">
      <button class="ctrl" id="left">◀</button>
      <button class="ctrl" id="right">▶</button>
      <button class="ctrl" id="brake">FREIO</button>
      <button class="ctrl" id="handbrake">FREIO MÃO</button>
    </div>

    <div class="rightPad">
      <button class="ctrl" id="cameraBtn">CÂMERA</button>
      <button class="ctrl" id="vehicleBtn">TROCAR</button>
      <button class="ctrl" id="horn">BUZINA</button>
      <button class="ctrl throttle" id="throttle">ACELERAR</button>
    </div>
  </div>

  <div id="tips">Explore a cidade. Toque em TROCAR para alternar entre carro e moto.</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
